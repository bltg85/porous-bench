; Stage 1: bring-up, no Resident. Boots, prints chip info, draws a test card on
; the Seeed Studio Round Display for XIAO (GC9A01, 240x240 round) driven by a
; XIAO ESP32S3, times a full-frame push, scans the I2C bus (touch 0x2E, RTC
; 0x51) and marks touches.
[env:xiao-round]
platform = espressif32@6.12.0
; ESP32-S3R8: 8 MB octal PSRAM, 8 MB flash. The board file sets qio_opi, PSRAM
; and native USB (ARDUINO_USB_MODE=1, ARDUINO_USB_CDC_ON_BOOT=1).
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

lib_ldf_mode = deep
lib_deps =
    adafruit/Adafruit GC9A01A@^1.1.0
    adafruit/Adafruit GFX Library@^1.11.10
    adafruit/Adafruit BusIO@^1.17.0
