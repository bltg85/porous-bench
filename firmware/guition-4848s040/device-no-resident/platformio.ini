; Stage 1: bring-up, no Resident. Boots, prints chip info, starts the ST7701S
; panel and its RGB scan, measures the scan rate and how long a full-frame copy
; takes, draws a test card, ramps the backlight, scans the I2C bus (GT911 at
; 0x5D) and draws a crosshair where the touch panel says a finger is.
[env:guition-4848]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; ESP32-S3 with 8 MB octal PSRAM and 16 MB quad flash. Serial is UART0, through
; the CH340 on the USB-C.
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    -DBOARD_HAS_PSRAM

lib_ldf_mode = deep
lib_deps =
    ; The panel, as stage 3 drives it.
    symlink://../device/lib/panel
    adafruit/Adafruit GFX Library@^1.11.10
    adafruit/Adafruit BusIO@^1.17.0
