; Stage 1: bring-up, no Resident. Boots, prints chip info, draws a test card on
; the Waveshare ESP32-S3-Touch-LCD-2 (ST7789T3, 240x320, no RAM offset), times
; a full-frame push, scans the I2C bus (touch 0x15, IMU 0x6B) and marks touches.
[env:s3-lcd2]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; ESP32-S3R8: 8 MB octal PSRAM; 16 MB quad flash.
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; Native USB only: without these, Serial stays silent.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_ldf_mode = deep
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
    adafruit/Adafruit GFX Library@^1.11.10
    adafruit/Adafruit BusIO@^1.17.0
